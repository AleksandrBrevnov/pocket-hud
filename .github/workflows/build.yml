name: Build PocketHUD APK

on:
  push:
    branches: [ "main", "master", "feature/soundcore-d3200-ble-input" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Parsed version: $VERSION_NAME"

      - name: Verify Debug Keystore
        run: |
          keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey

      - name: Test and build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketHUD-debug-junit
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: error
          overwrite: true

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PocketHUD-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          overwrite: true

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PocketHUD-debug-apk
          path: release-apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: PocketHUD Release v${{ needs.build.outputs.version }}
          files: release-apk/**/*.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
