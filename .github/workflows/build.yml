name: Build PocketHUD APK

on:
  push:
    branches: [ "main", "master", "asr-test/**", "feature/soundcore-d3200-ble-input", "feature/soundcore-hfp-audio-routing" ]
    tags: [ "v*" ]
  workflow_dispatch:

# Only the newest commit on a branch needs an APK. This prevents simultaneous
# Maven Central dependency downloads and reduces HTTP 429 rate limiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test privacy-safe D3200 HCI command analyzer
        run: python3 -m unittest discover -s tools -p 'test_d3200_hci_audit.py' -v

      - name: Test D3200 keystore metadata probe with synthetic fixtures
        run: python3 -m unittest discover -s tools -p 'test_d3200_keystore_metadata_probe.py' -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Parsed version: $VERSION_NAME"

      - name: Verify Debug Keystore
        run: |
          keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PocketHUD-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          overwrite: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketHUD-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          overwrite: true

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: PocketHUD Release v${{ env.VERSION_NAME }}
          files: app/build/outputs/apk/**/*.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
